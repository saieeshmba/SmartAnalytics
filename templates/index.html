<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Customer Churn Insights Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}" />
  </head>
  <body class="bg-light">
    <div class="container py-4">
      <h1 class="mb-1">Customer Churn Insights Dashboard</h1>
      <p class="text-muted">Upload customer activity CSV and explore churn, retention, cohorts, and segment trends.</p>

      <div class="card mb-4">
        <div class="card-body">
          <form id="upload-form" class="row g-3 align-items-end">
            <div class="col-md-8">
              <label for="file-input" class="form-label">Customer CSV</label>
              <input class="form-control" id="file-input" type="file" accept=".csv" required />
            </div>
            <div class="col-md-4 d-grid">
              <button class="btn btn-primary" type="submit">Upload & Analyze</button>
            </div>
          </form>
          <div id="status" class="small mt-3"></div>
          <a class="btn btn-outline-secondary btn-sm mt-2 d-none" id="export-link" href="/api/export/summary.csv">Download Summary CSV</a>
        </div>
      </div>

      <div class="row g-3 mb-4" id="summary-cards">
        <div class="col-sm-6 col-lg-3"><div class="card p-3"><div class="metric-label">Total Customers</div><div id="total-customers" class="metric-value">-</div></div></div>
        <div class="col-sm-6 col-lg-3"><div class="card p-3"><div class="metric-label">Churn Rate</div><div id="churn-rate" class="metric-value">-</div></div></div>
        <div class="col-sm-6 col-lg-3"><div class="card p-3"><div class="metric-label">Retention Rate</div><div id="retention-rate" class="metric-value">-</div></div></div>
        <div class="col-sm-6 col-lg-3"><div class="card p-3"><div class="metric-label">Avg Tenure (Days)</div><div id="avg-tenure" class="metric-value">-</div></div></div>
      </div>

      <div class="row g-4">
        <div class="col-lg-6"><div class="card p-3"><h5>Cohort Churn Rate</h5><canvas id="cohortChart"></canvas></div></div>
        <div class="col-lg-6"><div class="card p-3"><h5>Monthly Churn Trend</h5><canvas id="trendChart"></canvas></div></div>
        <div class="col-12"><div class="card p-3"><h5>Plan Segment Churn</h5><canvas id="segmentChart"></canvas></div></div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
    <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
  </body>
</html>
